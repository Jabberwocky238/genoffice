name: WJKJ Enterprise Builds

on:
  push:
    branches: [wjkj]
  workflow_dispatch:

concurrency:
  group: wjkj-enterprise-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Read application version
        id: metadata
        shell: pwsh
        run: |
          $version = node -p "require('./apps/shell/package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build applications
        run: npm run notices && npm run build:all

      - name: Package Windows application
        run: npm run dist:win -w @genoffice/shell

      - name: Rename Windows installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem 'apps/shell/release/*.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installers.Count)."
          }
          $name = 'wjkj-genoffice-ee-${{ steps.metadata.outputs.version }}-windows.exe'
          Move-Item $installers[0].FullName "apps/shell/release/$name"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wjkj-genoffice-ee-${{ steps.metadata.outputs.version }}-windows
          path: apps/shell/release/wjkj-genoffice-ee-${{ steps.metadata.outputs.version }}-windows.exe
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS arm64
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Read application version
        id: metadata
        run: echo "version=$(node -p "require('./apps/shell/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build applications
        run: npm run notices && npm run build:all

      - name: Package macOS application
        run: npm run dist:mac -w @genoffice/shell

      - name: Rename macOS installer
        run: |
          set -eu
          set -- apps/shell/release/*.dmg
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "Expected exactly one macOS installer, found $#." >&2
            exit 1
          fi
          mv "$1" "apps/shell/release/wjkj-genoffice-ee-${{ steps.metadata.outputs.version }}-macos.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wjkj-genoffice-ee-${{ steps.metadata.outputs.version }}-macos
          path: apps/shell/release/wjkj-genoffice-ee-${{ steps.metadata.outputs.version }}-macos.dmg
          if-no-files-found: error
          retention-days: 30
